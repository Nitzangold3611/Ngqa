<style>
:root{color-scheme:light dark;--navy:#121133;--teal:#14DACD;--teal-d:#0E9F97;--orange:#F38911;--red:#e5484d;--green:#1fb57a;
--bg:light-dark(#f4f6fb,#0b0a24);--card:light-dark(#fff,#18173f);--ink:light-dark(#121133,#eef0ff);--mute:light-dark(#5d5c7c,#a9a8cf);--line:light-dark(#e1e3ef,#2a2960);--soft:light-dark(#eef9f8,#14304a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 Heebo,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center;padding:10px max(3vw,14px);flex-wrap:wrap}
.bar b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a,.bar button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 14px;text-decoration:none;font-size:15px}
.wrap{max-width:1240px;margin:auto;padding:22px max(3vw,14px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.tabs button[aria-selected=true]{border-color:var(--orange);background:var(--orange);color:#fff}.tabs button[aria-selected=true] small{color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px)}

.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.q{font-size:20px;font-weight:700;margin:0 0 14px;line-height:1.45}
.opts{display:grid;gap:10px}@media(min-width:1000px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 14px;width:100%}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800}

.opt.ok{border-color:var(--green);background:light-dark(#ecfbf4,#123a2c)}.opt.ok .l{background:var(--green)}

.fb{font-weight:800;font-size:17px}.fb.ok{color:var(--green)}.fb.bad{color:var(--red)}

.res .acts button{border:0;border-radius:10px;padding:9px 20px;font-weight:700;background:var(--orange);color:#fff}.res .acts button.sec{background:none;border:1px solid var(--line);color:var(--ink)}
.print{display:none}
footer{text-align:center;color:var(--mute);font-size:14px;padding:22px}footer .ver{display:block}
@media(max-width:600px){.bar a,.bar button{padding:5px 10px;font-size:13.5px}.q{font-size:18px}}

<script>
const C=[{"n": 1, "t": "מבוא לבדיקות תוכנה", "qs": [{"q": "מהי ההגדרה הנכונה ביותר לבדיקות תוכנה?", "o": ["תיקון הקוד אחרי שמשתמש דיווח על תקלה", "קבוצת פעילויות לגילוי פגמים ולהערכת איכות של תוצרי תוכנה", "אימות שהתוכנה עומדת בדרישות, ולא יותר", "הרצת התוכנה כדי למצוא באגים בלבד"], "w": ["תיקון הקוד הוא ניפוי באגים (Debugging), לא בדיקות.", "נכון: בדיקות הן אוסף פעילויות — דינמיות וסטטיות — שמגלות פגמים ומעריכות איכות.", "בדיקות כוללות גם תיקוף (Validation) — שהמערכת עונה על צורכי המשתמשים — ולא רק אימות.", "בדיקות כוללות גם פעילויות שלא מריצות קוד, כמו סקירות."], "a": 1}, {"q": "מה ההבדל בין אימות (Verification) לתיקוף (Validation)?", "o": ["אין הבדל, אלה שמות נרדפים", "תיקוף נעשה על ידי מפתחים ואימות על ידי בודקים", "אימות נעשה רק בבדיקות סטטיות ותיקוף רק בדינמיות", "אימות בודק שעומדים בדרישות; תיקוף בודק שהמערכת עונה על צורכי המשתמשים בסביבתם"], "w": ["יש הבדל מהותי בין השניים.", "החלוקה אינה לפי מי שמבצע.", "שני הסוגים יכולים להתבצע גם סטטית וגם דינמית.", "נכון: \"בנינו את המוצר נכון?\" מול \"בנינו את המוצר הנכון?\"."], "a": 3}, {"q": "מה מבדיל בין בדיקות דינמיות לבדיקות סטטיות?", "o": ["בדיקות דינמיות נעשות רק אחרי שחרור לייצור", "בדיקות סטטיות מוצאות רק כשלים", "בדיקות דינמיות מריצות את התוכנה; בדיקות סטטיות לא מריצות אותה", "בדיקות סטטיות נעשות רק באופן ידני"], "w": ["בדיקות דינמיות מתחילות כבר ברמת הרכיב.", "בדיקות סטטיות מוצאות פגמים; כשל מתרחש רק בהרצה.", "נכון: זה ההבדל המהותי — הרצה של רכיב או מערכת לעומת בחינה ללא הרצה.", "גם כלי ניתוח סטטי הם בדיקה סטטית, והם אוטומטיים."], "a": 2}, {"q": "איזו מהבאות אינה מטרה אופיינית של בדיקות לפי הסילבוס?", "o": ["גרימת כשלים ומציאת פגמים", "מתן מידע לבעלי העניין כדי לקבל החלטות", "הערכת תוצרי עבודה כמו דרישות וקוד", "הוכחה שאין בתוכנה פגמים כלל"], "w": ["זו מטרה מוכרת של בדיקות.", "זו מטרה מוכרת: בדיקות מספקות מידע להחלטות, למשל על שחרור.", "זו מטרה מוכרת של בדיקות.", "נכון: בדיקות מראות נוכחות של פגמים, ולא יכולות להוכיח שאין פגמים."], "a": 3}, {"q": "מה ההבדל בין בדיקות לניפוי באגים (Debugging)?", "o": ["בדיקות קרת האיכות, שהיא חלק מניהול האיכות.", "בדיקות לא מבטיחות לוח זמנים."], "a": 0}, {"q": "מה ההבדל בין הבטחת איכות (QA) לבקרת איכות (QC)?", "o": ["QC מתמקדת בתהליך; QA מתמקדת במוצר", "QA ו-QC הם שמות אחרים לבדיקות", "QA מתמקדת בתהליך ומונעת; QC מתמקדת במוצר ומתקנת — ובדיקות הן חלק מ-QC", "QA נעשית רק על ידי מנהלים"], "w": ["זה הפוך.", "בדיקות הן צורה של QC, לא שם נרדף ל-QA.", "נכון: QA משפרת תהליכים כדי למנוע בעיות; QC (כולל בדיקות) בוחנת את המוצר כדי למצוא בעיות.", "QA היא אחריות של כולם, לא רק של מנהלים."], "a": 2}, {"q": "לפי העיקרון \"בדיקות מראות נוכחות פגמים, לא היעדרם\", מה נכון?", "o": ["אם הבדיקות עברו, אין פגמים בתוכנה", "צריך לבדוק עד שלא נמצאים פגמים", "בדיקות מקטינות את ההסתברות לפגמים שלא התגלו, אבל לא מוכיחות שאין", "אין טעם לבדוק אם אי אפשר להוכיח שאין פגמים"], "w": ["זה בדיוק מה שהעיקרון שולל.", "הפסקת הבדיקות נקבעת לפי קריטריוני יציאה וסיכון.", "נכון: גם אחרי בדיקות טובות ייתכנו פגמים שלא התגלו.", "לבדיקות יש ערך רב גם בלי הוכחה מלאה."], "a": 2}, {"q": "מה המשמעות של העיקרון \"בדיקות ממצות אינן אפשריות\"?", "o": ["אסור לבדוק יותר מדי", "רק אוטומציה יכולה לבדוק באופן ממצה", "אי אפשר לבדוק את כל צירופי הקלטים והתנאים, ולכן מתעדפים לפי סיכון וטכניקות", "צריך לבדוק רק את הדרישות הקריטיות"], "w": ["העיקרון לא מגביל כמות, הוא מסביר למה צריך לבחור.", "גם אוטומציה לא יכולה לבדוק את כל הצירופים.", "נכון: מלבד מקרים טריוויאליים, מספר הצירופים עצום, ולכן משתמשים בטכניקות, בתיעדוף ובניתוח סיכונים.", "תיעדוף הוא תוצאה של העיקרון, אבל העיקרון עצמו רחב יותר."], "a": 2}, {"q": "צוות התחיל לבדוק את מסמך הדרישות עוד לפני שנכתב קוד. איזה עיקרון בא לידי ביטוי?", "o": ["פרדוקס ההדברה", "בדיקות מוקדמות חוסכות זמן וכסף", "בדיקות תלויות הקשר", "פגמים מתקבצים"], "w": ["פרדוקס ההדברה עוסק בבדיקות שחוזרות על עצמן.", "נכון: פגם שמתגלה מוקדם (Shift-Left) זול לתיקון ומונע פגמים נגזרים.", "העיקרון הזה עוסק בהתאמת הבדיקות להקשר.", "זה עיקרון על ריכוז פגמים ברכיבים מעטים."], "a": 1}, {"q": "רוב הפגמים בגרסה האחרונה נמצאו בשני מודולים מתוך עשרים. איזה עיקרון זה מדגים?", "o": ["פגמים מ ות.", "נכון: ההנחה היא שכל הערכים בקבוצה מתנהגים אותו דבר, ולכן ערך אחד מייצג אותה."], "a": 3}, {"q": "שדה גיל מקבל מספרים שלמים מ-18 עד 65. כמה קבוצות שקילות יש (חוקיות ולא חוקיות)?", "o": ["6", "4", "3", "2"], "w": ["זה מספר הערכים ב-BVA תלת-ערכי, לא מספר הקבוצות.", "אין כאן ארבע קבוצות.", "נכון: מתחת ל-18 (לא חוקי), 18–65 (חוקי), מעל 65 (לא חוקי).", "חסרה קבוצה אחת."], "a": 2}, {"q": "באותו שדה גיל (18–65), מהו המספר המינימלי של מקרי בדיקה לכיסוי 100% מקבוצות השקילות?", "o": ["2", "4", "1", "3"], "w": ["עדיין חסרה קבוצה.", "יותר מהמינימום.", "ערך אחד מכסה רק קבוצה אחת.", "נכון: ערך אחד מכל אחת משלוש הקבוצות, למשל 10, 30 ו-70."], "a": 3}, {"q": "שדה גיל מקבל 18–65. אילו ערכים נבדקים ב-BVA דו-ערכי (Two-value)?", "o": ["17, 18, 65, 66", "18 ו-65", "17, 18, 19, 64, 65, 66", "0, 18, 65, 100"], "w": ["נכון: בשיטה הדו-ערכית בודקים את ערך הגבול ואת השכן הקרוב מעברו, בכל גבול.", "חסרים הערכים שמעבר לגבול.", "זו השיטה התלת-ערכית.", "0 ו-100 אינם ערכי קצה."], "a": 0}, {"q": "באותו שדה (18–65), כמה ערכים נבדקים ב-BVA תלת-ערכי (Three-value)?", "o": ["6", "8", "5", "4"], "w": ["נכון: 17, 18, 19 ו-64, 65, 66 — הגבול ושני שכניו בכל צד.", "יותר מדי ערכים.", "חסר ערך.", "זו השיטה הדו-ערכית."], "a": 0}, {"q": "למה כדאי לבדוק דווקא ערכי קצה?", "o": ["כי מפתחים טועים לעיתים קרובות בגבולות — למשל < במקום <=", "כי הם מכסים את כל הקוד", "כי הם הערכים הנפוצים ביותר אצל משתמשים", "כי הם הכי קלים לבדיקה"], "w": ["נכון: טעויות \"פלוס-מינוס אחד\" נפוצות מאוד, ולכן גבולות הם מקום מועד לפגמים.", "ערכי קצה לא מבטיחים כיסוי קוד.", "זו לא הסיבה.", "זו לא הסיבה."], "a": 0}, {"q": "על איזו טכניקה מתאים לבנות בדיקות לכללים עסקיים עם צירופים של תנאים?", "o": ["מעבר בין מצבים", "טבלאות החלטה (Decision Tables)", "ניחוש שגיאות", "כיסוי הצהרות"], "w": ["מעבר בין מצבים מתאים להתנהגות שתלויה במצב קודם.", "נכון: טבלת החלטה מציגה צירופים של תנאים והפעולות שנובעות מהם.", "ניחוש שגיאות מבוסס ניסיון, לא צירופים.", "זו טכניקת קופסה לבנה."], "a": 1}, {"q": "לכלל עסקי יש שלושה תנאים בוליאניים (כן/לא). כמה עמודות ( function tabs(){$('tabs').innerHTML=C.map(c=>{const b=S['best'+c.n];return `<button type="button" role="tab" data-n="${c.n}" aria-selected="${ch&&ch.n===c.n}">פרק ${c.n}<small>${b!=null?'שיא: '+b+'/'+c.qs.length:c.qs.length+' שאלות'}</small></button>`}).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>start(+b.dataset.n))}
function start(n,only){ch=C.find(c=>c.n===n);st={i:0,ans:[],ids:only||ch.qs.map((_,i)=>i)};history.replaceState(null,'','#ch'+n);tabs();show();printView()}
function show(){const k=st.ids[st.i],q=ch.qs[k],a=st.ans[st.i];
  $('card').innerHTML=`<div class="head"><span>פרק ${ch.n} · ${ch.t}</span><span>שאלה ${st.i+1} מתוך ${st.ids.length}</span></div>
  <div class="prog"><i style="width:${st.i/st.ids.length*100}%"></i></div><p class="q">${q.q}</p>
  <div class="opts ${a!=null?'done':''}">${q.o.map((o,j)=>`<button type="button" class="opt ${a!=null?(j===q.a?'ok':(j===a?'bad':'')):''}" data-j="${j}" ${a!=null?'disabled':''}><span class="l">${L[j]}</span><span class="tx">${o}<span class="why">${q.w[j]}</span></span></button>`).join('')}</div>
  <div class="nav"><span class="fb ${a==null?'':(a===q.a?'ok':'bad')}">${a==null?'':(a===q.a?'✓ נכון!':'✗ לא נכון — התשובה הנכונה: '+L[q.a])}</span>
  <span>${st.i>0?'<button type="button" class="sec" id="prev">הקודמת</button> ':''}${a!=null?`<button type="button" class="next" id="nx">${st.i<st.ids.length-1?'לשאלה הבאה':'לתוצאות'}</button>`:''}</span></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[st.i]=+b.dataset.j;show()});
  const nx=$('nx');if(nx){nx.onclick=()=>{if(st.i<st.ids.length-1){st.i++;show()}else result()};nx.focus()}
  const pv=$('prev');if(pv)pv.onclick=()=>{st.i--;show()}}
function result(){const wrong=st.ids.filter((k,i)=>st.ans[i]!==ch.qs[k].a),ok=st.ids.length-wrong.length;
  if(st.ids.length===ch.qs.length){S['best'+ch.n]=Math.max(S['best'+ch.n]||0,ok);save()}
  const pct=Math.round(ok/st.ids.length*100),next=C.find(c=>c.n===ch.n+1);
  $('card').innerHTML=`<div class="res"><div class="head"><span>פרק ${ch.n} · ${ch.t}</span><span>התוצאה שלך</span></div><div class="big">${ok}/${st.ids.length}</div>
  <p>${pct>=80?'מצוין! אתם מוכנים לפרק הבא.':pct>=65?'יפה — כדאי לחזור על השאלות שטעיתם בהן.':'כדאי לחזור על הפרק במצגת, ולנסות שוב.'}</p>
  ${wrong.length?`<ul>${wrong.map(k=>`<li>${ch.qs[k].q} — <b>${L[ch.qs[k].a]}. ${ch.qs[k].o[ch.qs[k].a]}</b></li>`).join('')}</ul>`:''}
  <div class="acts">${wrong.length?`<button type="button" id="rw">תרגול רק של הטעויות (${wrong.length})</button>`:''}<button type="button" class="sec" id="ra">מההתחלה</button>${next?`<button type="button" class="sec" id="nc">לפרק ${next.n}</button>`:`<button type="button" class="sec" id="nc">חזרה לפרק ${C[0].n}</button><a class="sec" href="../">חזרה לקורס</a>`}</div></div>`;
  tabs();if($('rw'))$('rw').onclick=()=>start(ch.n,wrong);$('ra').onclick=()=>start(ch.n);if($('nc'))$('nc').onclick=()=>start(next?next.n:C[0].n)}
function printView(){$('print').innerHTML=`<h2>CTFL 4.0 · שאלות חזרה · פרק ${ch.n} — ${ch.t}</h2>`+ch.qs.map((q,i)=>`<div class="pq"><b>${i+1}. ${q.q}</b><ol>${q.o.map(o=>`<li>${o}</li>`).join('')}</ol></div>`).join('')+
  `<div class="key"><h2>תשובות והסברים — פרק ${ch.n}</h2><ol>${ch.qs.map(q=>`<li><b>${L[q.a]}.</b> ${q.o[q.a]} — ${q.w[q.a]}</li>`).join('')}</ol></div>`}
$('prt').onclick=()=>window.print();
const m=location.hash.match(/ch(\d+)/);start(m&&C.find(c=>c.n===+m[1])?+m[1]:C[0].n);
</script>
</body>
</html>
