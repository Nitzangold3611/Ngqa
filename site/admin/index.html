<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ניהול משתמשים · NGQA הדרכות</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#121133">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--navy:#121133;--teal:#14DACD;--teal-d:#0E9F97;--orange:#F38911;--red:#c0392b;
--bg:light-dark(#f4f6fb,#0b0a24);--card:light-dark(#fff,#18173f);--ink:light-dark(#121133,#eef0ff);--mute:light-dark(#5d5c7c,#a9a8cf);--line:light-dark(#e1e3ef,#2a2960);--soft:light-dark(#eef0f8,#26255a)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Heebo,Arial,sans-serif}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button,input{font:inherit}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(3vw,12px);position:sticky;top:0;z-index:5}
.bar img{height:38px}.bar h1{font-size:19px;margin:0;flex:1}
.bar a{color:#c9cbf0;text-decoration:none;border:1.5px solid #3b3a78;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.bar a:hover{color:var(--teal);border-color:var(--teal)}
main{max-width:1000px;margin:0 auto;padding:20px max(3vw,12px) 60px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0 0 12px;font-size:18px}
.inv{display:grid;grid-template-columns:1fr 1.3fr 1fr .9fr auto;gap:10px;align-items:end}
.inv label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.inv input[type=text],.inv input[type=email],.inv input[type=tel],.inv input[type=date],.search,.flt,dialog input{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.inv .crs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:14px}
.btn{min-height:42px;padding:0 16px;border-radius:10px;border:0;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--teal-d)}.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal-d);background:transparent}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 40%,transparent)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top h2{margin:0;flex:1}.search{min-width:220px}
.stats{color:var(--mute);font-size:14px}
.list{display:grid;gap:10px}
.u{display:grid;grid-template-columns:minmax(0,1.4fr) auto auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.u.blocked{opacity:.6}
.who b{display:block;font-size:16px}.who small{color:var(--mute);direction:ltr;display:block;text-align:end;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft)}
.chip.ph{direction:ltr}.chip.exp{background:#fff1dc;color:#8a4b00}.chip.dead{background:#fde2e2;color:#9b1c1c}
.chip.pend{background:#fff1dc;color:#8a4b00}.chip.adm{background:var(--navy);color:#fff}.chip.blk{background:#fde2e2;color:#9b1c1c}.chip.g{background:#e7f0fe;color:#1a56b8}
.sw{display:flex;gap:14px;flex-wrap:wrap}
.tg{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .t{width:46px;height:26px;border-radius:999px;background:#c9cbd8;position:relative;transition:background .2s}
.tg .t::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.tg input:checked+.t{background:var(--teal-d)}.tg input:checked+.t::after{inset-inline-start:23px}
.tg input:focus-visible+.t{outline:3px solid var(--orange);outline-offset:2px}
.tg input:disabled+.t{opacity:.5}
.more{position:relative}
.more>button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:20px;line-height:1}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:6px;display:none;z-index:4}
.more.open .menu{display:block}
.menu button{display:block;width:100%;text-align:start;padding:10px;border:0;background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--soft)}.menu .del{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;z-index:20;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
.msg{text-align:center;color:var(--mute);padding:40px 10px}
.wa{display:none;margin-top:12px;padding:12px;border-radius:12px;background:light-dark(#e9fbf3,#123a2c);border:1px solid #9be3c4;font-size:14px}
.wa.on{display:block}.wa p{margin:0 0 8px;white-space:pre-line}
.gate{max-width:520px;margin:60px auto;text-align:center}
.inv .opt{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.flt{min-width:190px}
.u.expired{opacity:.7}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(10,10,30,.45)}
dialog h3{margin:0 0 4px}dialog p{margin:0 0 12px;color:var(--mute);font-size:14px}
dialog form{display:grid;gap:12px}dialog label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
dialog .row{display:flex;gap:8px;align-items:center}dialog .row input{flex:1}
dialog .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:4px}
.hint{font-size:12.5px;color:var(--mute);font-weight:400}
.tgw{display:flex;flex-direction:column;align-items:center;gap:4px}
.rec{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap}
.rec input{width:15px;height:15px;accent-color:var(--orange);margin:0}.rec.on{color:#b45309}
.chip.lv{background:#fff1dc;color:#8a4b00}.chip.soon{background:#fff1dc;color:#8a4b00;font-weight:700}
.sel{display:flex;align-items:center;gap:8px}.sel input{width:18px;height:18px;accent-color:var(--teal-d)}
.bulk{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border:1.5px dashed var(--teal-d);border-radius:12px;font-size:14px}
.bulk.on{display:flex}.bulk select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
#adlg{width:min(760px,96vw)}
.acc{display:grid;gap:10px;max-height:62vh;overflow:auto;padding:2px}
.acr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center}
.acr>b{grid-row:1/-1;align-self:start;padding-top:6px}
.acr select,.acr input[type=date],.acr input[type=text]{padding:7px 9px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.acr .dl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.acr .dl button{padding:4px 9px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:12.5px}
.acr .dl button:hover{border-color:var(--teal)}.acr.off .dl,.acr.off .nt{opacity:.45;pointer-events:none}
.acr .nt{width:100%}
.inv .rlv{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
@media(max-width:600px){.acr{grid-template-columns:1fr}.acr>b{grid-row:auto}}
@media(max-width:760px){.inv{grid-template-columns:1fr}.flt{min-width:0;flex:1}.u{grid-template-columns:1fr auto}.u .sw{grid-column:1/-1;order:3}.search{min-width:0;flex:1}}
</style>
</head>
<body>
<header class="bar"><img src="/logo.png" alt="NGQA"><h1>ניהול משתמשים</h1><a href="/">← לאתר הקורסים</a></header>
<main id="main"><p class="msg">טוען…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/auth.js"></script>
<script>
{
const A=window.NGQAAuth,$=id=>document.getElementById(id);
const NAMES={ctfl:'CTFL 4.0',genai:'CT-GenAI',sql:'SQL',ste:'CT-STE',ai:'CT-AI',mat:'CT-MAT',jobs:'מחפשי עבודה'};
let users=[],courses=['ctfl','genai','sql','ste','ai','mat','jobs'],recC=['genai'],meEmail='',q='',cflt='all',picked=new Set();
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt=0;function toast(t,bad){const e=$('toast');e.textContent=t;e.classList.toggle('err',!!bad);e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3200)}
async function api(method,body){
  const s=await A.session();if(!s)throw new Error('יש להתחבר מחדש');
  const r=await fetch('/.netlify/functions/admin',{method,headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||('שגיאה '+r.status));return d}
const todayIL=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date());
const dmy=d=>d?d.split('-').reverse().join('/'):'';
const daysTo=d=>Math.round((Date.parse(d)-Date.parse(todayIL()))/864e5);
const expired=u=>!!u.expires&&!u.roles.includes('admin')&&todayIL()>=u.expires;
/* status for the filter: invited (no sign-up yet), active, blocked, expired */
/* v3.11 access levels per course: roles "<c>" = materials, "<c>-rec" = + recorded lessons; dates in u.access[c] = {m, r, note} */
const accOf=(u,c)=>(u.access&&u.access[c])||{};
const lvOf=(u,c)=>u.roles.includes('admin')?(recC.includes(c)?'full':'materials'):!u.roles.includes(c)?'none':(recC.includes(c)&&u.roles.includes(c+'-rec')?'full':'materials');
const LVN={none:'ללא גישה',materials:'מצגות וחומרים',full:'מלא (כולל הקלטות)'};
const addMonths=(base,n)=>{const t=todayIL(),b=base&&base>t?base:t;const d=new Date(b+'T12:00:00Z');const day=d.getUTCDate();d.setUTCMonth(d.getUTCMonth()+n);if(d.getUTCDate()<day)d.setUTCDate(0);return d.toISOString().slice(0,10)};
/* the soonest end date (course materials or recordings) inside the next 14 days, or null */
const soonest=u=>{if(u.roles.includes('admin'))return null;let best=null;for(const c of courses){if(!u.roles.includes(c))continue;const a=accOf(u,c);
  for(const [k,d] of [['m',a.m],['r',u.roles.includes(c+'-rec')?a.r:'']])if(d&&daysTo(d)>=0&&daysTo(d)<=14&&(!best||d<best.d))best={c,k,d}}
  if(u.expires&&daysTo(u.expires)>=0&&daysTo(u.expires)<=14&&(!best||u.expires<best.d))best={c:'',k:'all',d:u.expires};return best};
const status=u=>u.blocked?'blocked':expired(u)?'expired':!u.confirmed?'invited':'active';
const showPhone=p=>p?(p.startsWith('972')&&p.length===12?'0'+p.slice(3,5)+'-'+p.slice(5):'+'+p):'';
const waLink=(p,t)=>'https://wa.me/'+p+'?text='+encodeURIComponent(t.replace(/\s*\u{1F44B}/u,''));
let flt='all',dlgId=null;
const fmt=d=>d?new Date(d).toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'}):'';
function shell(){
  $('main').innerHTML=`
  <section class="card" aria-labelledby="h1">
    <h2 id="h1">הזמנת תלמיד</h2>
    <form id="inv" class="inv">
      <label>שם מלא<input type="text" name="name" autocomplete="off"></label>
      <label>מייל<input type="email" name="email" required dir="ltr" autocomplete="off"></label>
      <label>טלפון נייד<input type="tel" name="phone" dir="ltr" autocomplete="off" placeholder="050-1234567"></label>
      <label>נעילת גישה בתאריך<input type="date" name="expires" min="${todayIL()}"></label>
      <button class="btn" type="submit">שליחת הזמנה</button>
      <label class="opt"><input type="checkbox" name="wa"> שליחת ההזמנה גם בוואטסאפ <span class="hint">(נפתח וואטסאפ עם הודעה מוכנה למספר שהוזן)</span></label>
      <div class="crs"><span>גישה לקורסים:</span>${courses.map(c=>`<label class="tg" style="flex-direction:row;gap:8px"><input type="checkbox" name="r" value="${c}" checked><span class="t"></span>${NAMES[c]||c}</label>${recC.includes(c)?`<label class="rlv"><input type="checkbox" name="rr" value="${c}"> כולל שיעורים מוקלטים ב-${NAMES[c]||c}</label>`:''}`).join('')}</div>
      <label class="opt">תוקף הגישה לקורסים שנבחרו: <select name="until" class="flt" style="min-width:0"><option value="">ללא הגבלת זמן</option><option value="3">3 חודשים</option><option value="6">6 חודשים</option><option value="12">12 חודשים</option></select><span class="hint">(אפשר לשנות לכל קורס בנפרד אחר כך, בתפריט ⋯ ← "גישה לקורסים ותאריכים")</span></label>
    </form>
    <div class="wa" id="wa"><p id="waT"></p><button class="btn ghost" type="button" id="waC">העתקת ההודעה לוואטסאפ</button></div>
  </section>
  <section class="card" aria-labelledby="h2">
    <div class="top"><h2 id="h2">תלמידים</h2><span class="stats" id="stats"></span><select class="flt" id="flt" aria-label="סינון לפי סטטוס"></select><select class="flt" id="cflt" aria-label="סינון לפי קורס ורמת גישה"></select><input class="search" id="q" type="search" placeholder="חיפוש לפי שם, מייל או טלפון" aria-label="חיפוש"></div>
    <div class="bulk" id="bulk"><b id="bulkN"></b><span>שינוי לנבחרים:</span><select id="bC" aria-label="קורס"></select><select id="bL" aria-label="רמת גישה"></select><select id="bM" aria-label="תוקף"><option value="">בלי לשנות תאריך</option><option value="3">+3 חודשים</option><option value="6">+6 חודשים</option><option value="12">+12 חודשים</option><option value="clear">ללא הגבלת זמן</option></select><button class="btn" type="button" id="bGo">החלה</button><button class="btn ghost" type="button" id="bX">ניקוי הבחירה</button></div>
    <div class="list" id="list"></div>
  </section>
  <dialog id="dlg" aria-labelledby="dlgH"><h3 id="dlgH">פרטי משתמש</h3><p id="dlgE" dir="ltr" style="text-align:end"></p>
    <form id="dlgF" method="dialog">
      <label>שם מלא<input type="text" name="name" autocomplete="off"></label>
      <label>טלפון נייד<input type="tel" name="phone" dir="ltr" autocomplete="off" placeholder="050-1234567"></label>
      <label>נעילת גישה בתאריך <span class="hint">החל מהתאריך הזה (שעון ישראל) הגישה לקורסים נחסמת אוטומטית. ריק = ללא הגבלה.</span>
        <span class="row"><input type="date" name="expires"><button class="btn ghost" type="button" id="dlgClr">ללא תאריך</button></span></label>
      <div class="acts"><button class="btn" type="submit" value="save">שמירה</button><button class="btn ghost" type="button" id="dlgX">ביטול</button></div>
    </form></dialog>
  <dialog id="adlg" aria-labelledby="adlgH"><h3 id="adlgH">גישה לקורסים ותאריכים</h3><p id="adlgE" dir="ltr" style="text-align:end"></p>
    <p>לכל קורס: רמת גישה ותאריך סיום (ריק = ללא הגבלה). מהתאריך הזה, לפי שעון ישראל, הגישה נחסמת אוטומטית. "מלא" כולל גם את השיעורים המוקלטים, ואפשר לתת להם תאריך סיום נפרד.</p>
    <form id="adlgF" method="dialog"><div class="acc" id="accRows"></div>
      <div class="acts"><button class="btn" type="submit">שמירה</button><button class="btn ghost" type="button" id="adlgX">ביטול</button></div></form></dialog>`;
  $('inv').onsubmit=invite;$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();list()};
  $('flt').onchange=e=>{flt=e.target.value;list()};
  $('dlgX').onclick=()=>$('dlg').close();$('dlgClr').onclick=()=>{$('dlgF').expires.value=''};
  $('dlgF').onsubmit=saveDetails;
  $('cflt').onchange=e=>{cflt=e.target.value;list()};$('adlgX').onclick=()=>$('adlg').close();$('adlgF').onsubmit=saveAccess;
  $('bC').innerHTML=courses.map(c=>`<option value="${c}">${NAMES[c]||c}</option>`).join('');
  const bl=()=>{const c=$('bC').value;$('bL').innerHTML=['materials',...(recC.includes(c)?['full']:[]),'none'].map(l=>`<option value="${l}">${LVN[l]}</option>`).join('')};$('bC').onchange=bl;bl();
  $('bX').onclick=()=>{picked.clear();list()};$('bGo').onclick=bulkApply;
  $('waC').onclick=async()=>{try{await navigator.clipboard.writeText($('waT').textContent);toast('ההודעה הועתקה')}catch(e){toast('לא הצלחתי להעתיק – סמנו והעתיקו ידנית',1)}};
}
function row(u){
  const self=u.email===meEmail,adm=u.roles.includes('admin');
  const ex=expired(u),dt=u.expires&&!adm?daysTo(u.expires):null;
  return `<div class="u${u.blocked?' blocked':''}${ex?' expired':''}" data-id="${u.id}">
    <div class="who"><label class="sel"><input type="checkbox" data-pick="${u.id}" ${picked.has(u.id)?'checked':''} ${adm?'disabled':''} aria-label="בחירה לשינוי קבוצתי"><b>${esc(u.name||u.email.split('@')[0])}</b></label><small>${esc(u.email)}</small>
      <div class="chips">${!u.confirmed?`<span class="chip pend">הוזמן ${fmt(u.invited_at)} · טרם נרשם</span>`:`<span class="chip">פעיל מ-${fmt(u.created_at)}</span>`}
      ${adm?'<span class="chip adm">מנהל</span>':''}${u.blocked?'<span class="chip blk">חסום</span>':''}${u.provider==='google'?'<span class="chip g">Google</span>':''}
      ${u.phone?`<span class="chip ph">${esc(showPhone(u.phone))}</span>`:''}
      ${dt===null?'':ex?`<span class="chip dead">הגישה ננעלה ב-${dmy(u.expires)}</span>`:`<span class="chip${dt<=14?' exp':''}">נעילה ב-${dmy(u.expires)}</span>`}
      ${adm?'':courses.filter(c=>u.roles.includes(c)||(u.blocked&&accOf(u,c).m)).map(c=>{const a=accOf(u,c),o=[];
        if(a.m)o.push(todayIL()>=a.m?`<span class="chip dead">${NAMES[c]}: הסתיים ${dmy(a.m)}</span>`:`<span class="chip${daysTo(a.m)<=14?' soon':''}">${NAMES[c]} עד ${dmy(a.m)}</span>`);
        if(recC.includes(c)&&u.roles.includes(c+'-rec'))o.push(a.r&&todayIL()>=a.r?`<span class="chip dead">הקלטות ${NAMES[c]}: הסתיים ${dmy(a.r)}</span>`:`<span class="chip lv">🎬 ${NAMES[c]}: כולל הקלטות${a.r?' עד '+dmy(a.r):''}</span>`);
        if(a.note)o.push(`<span class="chip" title="${esc(a.note)}">📝 ${NAMES[c]}</span>`);return o.join('')}).join('')}</div></div>
    <div class="sw">${courses.map(c=>{const tg=`<label class="tg"><input type="checkbox" data-c="${c}" ${u.roles.includes(c)||adm?'checked':''} ${adm||u.blocked?'disabled':''}><span class="t"></span>${NAMES[c]||c}</label>`;
      if(!recC.includes(c))return tg;const on=adm||u.roles.includes(c+'-rec');
      return `<span class="tgw">${tg}<label class="rec${on?' on':''}" title="שיעורים מוקלטים"><input type="checkbox" data-rec="${c}" ${on?'checked':''} ${adm||u.blocked||!u.roles.includes(c)?'disabled':''}>🎬 הקלטות</label></span>`}).join('')}</div>
    <div class="more"><button type="button" aria-label="פעולות נוספות עבור ${esc(u.email)}" aria-haspopup="true">⋯</button><div class="menu">
      ${!u.confirmed?'<button type="button" data-a="resend">שליחת ההזמנה שוב</button>':'<button type="button" data-a="recover">שליחת קישור לאיפוס סיסמה</button>'}
      ${adm?'':'<button type="button" data-a="access">גישה לקורסים ותאריכים</button>'}
      <button type="button" data-a="edit">עריכת טלפון ותאריך נעילה</button>
      ${u.phone&&soonest(u)?'<button type="button" data-a="remind">תזכורת בוואטסאפ על סוף הגישה</button>':''}
      ${u.phone?'<button type="button" data-a="wasend">שליחת הזמנה בוואטסאפ</button>':''}
      <button type="button" data-a="wa">העתקת הודעה לוואטסאפ</button>
      ${self?'':`<button type="button" data-a="admin">${adm?'הסרת הרשאת מנהל':'הפיכה למנהל (גישה לכל הקורסים)'}</button>`}
      ${self?'':`<button type="button" data-a="block">${u.blocked?'ביטול חסימה':'חסימת גישה (בלי למחוק)'}</button>`}
      ${self?'':'<button type="button" data-a="delete" class="del">מחיקת המשתמש</button>'}
    </div></div></div>`}
function list(){
  const qd=q.replace(/\D/g,'');
  const cOk=u=>{if(cflt==='all')return true;if(cflt==='soon')return !!soonest(u);const [c,l]=cflt.split(':');const lv=lvOf(u,c);return l==='any'?lv!=='none':lv===l};
  const f=users.filter(u=>(flt==='all'||status(u)===flt)&&cOk(u)&&(!q||(u.email+' '+u.name).toLowerCase().includes(q)||(qd.length>2&&(u.phone+' 0'+u.phone.slice(3)).includes(qd)))).sort((a,b)=>(b.roles.includes('admin')-a.roles.includes('admin'))||(a.name||a.email).localeCompare(b.name||b.email,'he'));
  $('list').innerHTML=f.length?f.map(row).join(''):`<p class="msg">${users.length?'לא נמצאו תלמידים לסינון או לחיפוש הזה.':'עדיין אין תלמידים. הזמינו את הראשון למעלה.'}</p>`;
  const st=users.filter(u=>!u.roles.includes('admin'));
  const n=k=>users.filter(u=>status(u)===k).length;
  $('stats').textContent=`${st.length} תלמידים · ${n('invited')} ממתינים להרשמה`;
  $('flt').innerHTML=[['all','כל הסטטוסים',users.length],['invited','הזמנה נשלחה',n('invited')],['active','משתמש פעיל',n('active')],['blocked','חסום',n('blocked')],['expired','הגישה ננעלה',n('expired')]]
    .map(([v,l,c])=>`<option value="${v}"${v===flt?' selected':''}>${l} (${c})</option>`).join('');
  const cn=fn=>users.filter(fn).length;
  const opts=[['all','כל הקורסים',users.length],['soon','פג בקרוב (14 יום)',cn(u=>!!soonest(u))]];
  for(const c of courses){opts.push([c+':any',NAMES[c]+' – כל מי שיש לו גישה',cn(u=>lvOf(u,c)!=='none')]);
    if(recC.includes(c)){opts.push([c+':full',NAMES[c]+' – מלא (כולל הקלטות)',cn(u=>lvOf(u,c)==='full')]);opts.push([c+':materials',NAMES[c]+' – מצגות וחומרים בלבד',cn(u=>lvOf(u,c)==='materials')])}}
  $('cflt').innerHTML=opts.map(([v,l,c])=>`<option value="${v}"${v===cflt?' selected':''}>${l} (${c})</option>`).join('');
  for(const id of [...picked])if(!users.some(u=>u.id===id))picked.delete(id);
  $('bulk').classList.toggle('on',picked.size>0);$('bulkN').textContent=picked.size+' נבחרו';
}
function waText(name,email){return `שלום${name?' '+name:''} 👋\nפתחתי לך גישה לאתר המצגות של NGQA: https://courses.ngqa.net\nתקבל/י מייל מ-Netlify (באנגלית)${email?' לכתובת '+email:''} עם הנושא "You've been invited" – לחצו על הקישור, בחרו סיסמה ונכנסים. אם המייל לא מגיע, בדקו בספאם.\nאפשר גם להיכנס עם Google, אם המייל שלך הוא Gmail.`}
async function invite(e){
  e.preventDefault();const f=e.target,b=f.querySelector('.btn');
  const wantWa=f.wa.checked;if(wantWa&&!f.phone.value.trim()){toast('כדי לשלוח בוואטסאפ צריך להזין מספר טלפון',1);f.phone.focus();return}
  b.disabled=true;const w=wantWa?window.open('about:blank','_blank'):null;
  try{const d=await api('POST',{action:'invite',email:f.email.value,name:f.name.value,phone:f.phone.value,expires:f.expires.value,roles:(()=>{const r=[...f.querySelectorAll('[name=r]:checked')].map(x=>x.value);f.querySelectorAll('[name=rr]:checked').forEach(x=>{if(r.includes(x.value))r.push(x.value+'-rec')});return r})(),until:f.until.value?addMonths('',+f.until.value):''});
    users.push(d.user);list();toast('ההזמנה נשלחה ל-'+d.user.email+(w?' · וואטסאפ נפתח':''));
    if(w){if(d.user.phone)w.location=waLink(d.user.phone,waText(f.name.value.trim(),d.user.email));else w.close()}
    $('waT').textContent=waText(f.name.value.trim());$('wa').classList.add('on');f.reset();f.querySelectorAll('[name=r]').forEach(x=>x.checked=true)}
  catch(x){if(w)w.close();toast(x.message,1)}finally{b.disabled=false}}
async function saveDetails(e){
  e.preventDefault();const f=$('dlgF'),b=f.querySelector('[type=submit]');b.disabled=true;
  try{const d=await api('POST',{action:'details',id:dlgId,name:f.name.value,phone:f.phone.value,expires:f.expires.value});upd(d.user);$('dlg').close();toast('הפרטים נשמרו')}
  catch(x){toast(x.message,1)}finally{b.disabled=false}}
let accU=null;
function openAccess(u){accU=u;$('adlgE').textContent=(u.name?u.name+' · ':'')+u.email;
  $('accRows').innerHTML=courses.map(c=>{const a=accOf(u,c),lv=lvOf(u,c),rc=recC.includes(c);
    const dl=(k,v,l)=>`<span class="dl" data-k="${k}">${l}: <input type="date" data-d="${k}" value="${v||''}"> <button type="button" data-add="3">+3 ח׳</button><button type="button" data-add="6">+6 ח׳</button><button type="button" data-add="12">+12 ח׳</button><button type="button" data-add="0">ללא הגבלה</button></span>`;
    return `<div class="acr${lv==='none'?' off':''}" data-c="${c}"><b>${NAMES[c]||c}</b>
      <select data-lv aria-label="רמת גישה ל-${NAMES[c]}">${['none','materials',...(rc?['full']:[])].map(l=>`<option value="${l}"${l===lv?' selected':''}>${LVN[l]}</option>`).join('')}</select>
      ${dl('m',a.m,'סיום הגישה לקורס')}${rc?`<span class="rx"${lv==='full'?'':' hidden'}>${dl('r',a.r,'סיום השיעורים המוקלטים')}</span>`:''}
      <input type="text" class="nt" data-note maxlength="200" placeholder="הערה (למשל מספר קבלה)" value="${esc(a.note||'')}"></div>`}).join('');
  $('accRows').querySelectorAll('.acr').forEach(r=>{const s=r.querySelector('[data-lv]');s.onchange=()=>{r.classList.toggle('off',s.value==='none');const x=r.querySelector('.rx');if(x)x.hidden=s.value!=='full'};
    r.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const inp=b.parentNode.querySelector('input[type=date]');const n=+b.dataset.add;inp.value=n?addMonths(inp.value,n):''})});
  $('adlg').showModal()}
async function saveAccess(e){e.preventDefault();const b=$('adlgF').querySelector('[type=submit]');b.disabled=true;let u=accU,n=0;
  try{for(const r of $('accRows').querySelectorAll('.acr')){const c=r.dataset.c,a=accOf(u,c),lv=r.querySelector('[data-lv]').value;
      const m=r.querySelector('[data-d=m]').value,rr=(r.querySelector('[data-d=r]')||{}).value||'',note=r.querySelector('[data-note]').value.trim();
      if(lv===lvOf(u,c)&&m===(a.m||'')&&(lv!=='full'||rr===(a.r||''))&&note===(a.note||''))continue;
      if(lv!=='none'&&m&&m<todayIL()&&!confirm(`התאריך של ${NAMES[c]} כבר עבר — הגישה תיחסם מיד. להמשיך?`))continue;
      u=(await api('POST',{action:'access',id:u.id,course:c,level:lv,m:lv==='none'?'':m,r:lv==='full'?rr:'',note})).user;n++}
    upd(u);$('adlg').close();toast(n?`הגישה עודכנה (${n} קורסים)`:'לא היו שינויים')}
  catch(x){upd(u);toast(x.message,1)}finally{b.disabled=false}}
async function bulkApply(){const c=$('bC').value,lv=$('bL').value,mm=$('bM').value,ids=[...picked];
  if(!ids.length)return;if(!confirm(`לשנות ל-${ids.length} תלמידים: ${NAMES[c]} ← ${LVN[lv]}${mm?(mm==='clear'?', ללא הגבלת זמן':', הארכה של '+mm+' חודשים'):''}?`))return;
  const b=$('bGo');b.disabled=true;let ok=0,bad=0;
  for(const id of ids){const u=users.find(x=>x.id===id);if(!u||u.roles.includes('admin'))continue;const a=accOf(u,c);
    const m=lv==='none'?'':mm==='clear'?'':mm?addMonths(a.m||'',+mm):(a.m||''),r=lv!=='full'?'':mm==='clear'?'':mm?addMonths(a.r||'',+mm):(a.r||'');
    try{upd((await api('POST',{action:'access',id,course:c,level:lv,m,r,note:a.note||''})).user);ok++}catch(x){bad++}}
  b.disabled=false;picked.clear();list();toast(`עודכנו ${ok} תלמידים`+(bad?` · ${bad} נכשלו`:''),bad>0)}
function upd(u){const k=users.findIndex(x=>x.id===u.id);if(k>=0)users[k]=u;list()}
document.addEventListener('change',async e=>{
  const pk=e.target.closest('input[data-pick]');if(pk){pk.checked?picked.add(pk.dataset.pick):picked.delete(pk.dataset.pick);$('bulk').classList.toggle('on',picked.size>0);$('bulkN').textContent=picked.size+' נבחרו';return}
  const rt=e.target.closest('input[data-rec]');if(rt){const id=rt.closest('.u').dataset.id,u=users.find(x=>x.id===id),c=rt.dataset.rec,a=accOf(u,c);rt.disabled=true;
    try{const d=await api('POST',{action:'access',id,course:c,level:rt.checked?'full':'materials',m:a.m||'',r:a.r||'',note:a.note||''});upd(d.user);toast(`${NAMES[c]}: השיעורים המוקלטים ${rt.checked?'נפתחו':'נסגרו'} עבור ${d.user.name||d.user.email}`)}
    catch(x){rt.checked=!rt.checked;rt.disabled=false;toast(x.message,1)}return}
  const t=e.target.closest('input[data-c]');if(!t)return;
  const id=t.closest('.u').dataset.id,u=users.find(x=>x.id===id);
  const roles=new Set(u.roles);t.checked?roles.add(t.dataset.c):roles.delete(t.dataset.c);t.disabled=true;
  try{const d=await api('POST',{action:'roles',id,roles:[...roles]});upd(d.user);toast(`${NAMES[t.dataset.c]}: ${t.checked?'נפתח':'נסגר'} עבור ${d.user.name||d.user.email}`)}
  catch(x){t.checked=!t.checked;t.disabled=false;toast(x.message,1)}});
document.addEventListener('click',async e=>{
  const m=e.target.closest('.more>button');document.querySelectorAll('.more.open').forEach(x=>{if(!m||x!==m.parentNode)x.classList.remove('open')});
  if(m){m.parentNode.classList.toggle('open');return}
  const a=e.target.closest('[data-a]');if(!a)return;a.closest('.more').classList.remove('open');
  const id=a.closest('.u').dataset.id,u=users.find(x=>x.id===id),who=u.name||u.email;
  try{
    switch(a.dataset.a){
      case 'resend':await api('POST',{action:'resend',id});toast('ההזמנה נשלחה שוב');break;
      case 'recover':await api('POST',{action:'recover',id});toast('נשלח קישור לאיפוס סיסמה ל-'+u.email);break;
      case 'edit':{dlgId=id;const f=$('dlgF');f.name.value=u.name||'';f.phone.value=showPhone(u.phone);f.expires.value=u.expires||'';
        $('dlgE').textContent=u.email;f.expires.disabled=u.roles.includes('admin');$('dlgClr').disabled=u.roles.includes('admin');$('dlg').showModal();break}
      case 'access':openAccess(u);break;
      case 'remind':{const s=soonest(u);const what=s.k==='all'?'הגישה שלך לאתר הקורסים':s.k==='r'?'הגישה שלך לשיעורים המוקלטים בקורס '+NAMES[s.c]:'הגישה שלך לקורס '+NAMES[s.c];
        window.open(waLink(u.phone,`שלום${u.name?' '+u.name:''},\nתזכורת: ${what} ב-NGQA בתוקף עד ${dmy(s.d)}.\nרוצה להאריך? אפשר לענות כאן ונסדר.`),'_blank','noopener');break}
      case 'wasend':window.open(waLink(u.phone,waText(u.name,u.email)),'_blank','noopener');break;
      case 'wa':try{await navigator.clipboard.writeText(waText(u.name,u.email));toast('ההודעה הועתקה')}catch(x){$('waT').textContent=waText(u.name,u.email);$('wa').classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}break;
      case 'admin':{const adm=u.roles.includes('admin');if(!confirm(adm?`להסיר את הרשאת המנהל מ-${who}?`:`להפוך את ${who} למנהל? מנהל רואה את כל הקורסים ויכול לנהל משתמשים.`))return;
        const r=new Set(u.roles);adm?r.delete('admin'):r.add('admin');upd((await api('POST',{action:'roles',id,roles:[...r]})).user);toast('עודכן');break}
      case 'block':{if(!u.blocked&&!confirm(`לחסום את ${who}? הוא לא יוכל להיכנס לאף קורס עד שתבטלו.`))return;
        upd((await api('POST',{action:'block',id,blocked:!u.blocked})).user);toast(u.blocked?'החסימה בוטלה':'המשתמש נחסם');break}
      case 'delete':if(!confirm(`למחוק לצמיתות את ${who} (${u.email})? אי אפשר לבטל.`))return;
        await api('POST',{action:'delete',id});users=users.filter(x=>x.id!==id);list();toast('המשתמש נמחק');break}
  }catch(x){toast(x.message,1)}});
(async()=>{
  if(!(await A.isEnabled())){$('main').innerHTML='<div class="card gate"><h2>ההתחברות עוד לא הופעלה</h2><p>צריך להפעיל את Netlify Identity באתר. אחרי זה הדף הזה יעבוד.</p></div>';return}
  const i=A.info(await A.session());
  if(!i){location.replace('/?login=1&next='+encodeURIComponent('/admin/'));return}
  try{const d=await api('GET');users=d.users;courses=d.courses||courses;recC=d.rec||recC;meEmail=d.me;shell();list()}
  catch(x){$('main').innerHTML=`<div class="card gate"><h2>אין גישה לדף הניהול</h2><p>${esc(x.message)}</p><p><a href="/">חזרה לאתר</a></p></div>`}
})();
}
