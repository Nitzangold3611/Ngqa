<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>מערכת ניהול · NGQA הדרכות</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#121133">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--navy:#121133;--teal:#14DACD;--teal-d:#0E9F97;--orange:#F38911;--red:#c0392b;--green:#1f9d6a;
--bg:light-dark(#f4f6fb,#0b0a24);--card:light-dark(#fff,#18173f);--ink:light-dark(#121133,#eef0ff);--mute:light-dark(#5d5c7c,#a9a8cf);--line:light-dark(#e1e3ef,#2a2960);--soft:light-dark(#eef0f8,#26255a)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Heebo,Arial,sans-serif}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button,input,select{font:inherit}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(3vw,12px);position:sticky;top:0;z-index:5}
.bar img{height:38px}.bar h1{font-size:19px;margin:0;flex:1}
.bar a{color:#c9cbf0;text-decoration:none;border:1.5px solid #3b3a78;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.bar a:hover{color:var(--teal);border-color:var(--teal)}
main,.view{display:grid;gap:18px;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
/* v3.13 backoffice shell */
.bo{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;max-width:1440px;margin:0 auto;padding:20px max(3vw,12px) 60px;align-items:start}
.side{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;gap:2px}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15.5px}
.side a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--mute)}
.side a:hover{background:var(--soft)}.side a.on{background:var(--navy);color:#fff}.side a.on svg{color:var(--teal)}
.side a .soon{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.side a.on .soon{color:#c9cbf0;border-color:#3b3a78}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.vh h2{margin:0;font-size:22px;flex:1}
@media(max-width:900px){.bo{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto;gap:4px}.side a{white-space:nowrap;padding:8px 12px}.side a .soon{display:none}}
/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:start;cursor:pointer;color:var(--ink);display:grid;gap:2px}
.tile b{font-size:28px;line-height:1.1}.tile span{font-size:13.5px;color:var(--mute);font-weight:600}
.tile:hover{border-color:var(--teal)}.tile.on{border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 25%,transparent)}
.tile.warn b{color:#b45309}.tile.bad b{color:var(--red)}.tile.ok b{color:var(--green)}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{margin:0;font-size:20px;flex:1}
.filters{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:10px;margin-bottom:12px}
.search,.flt,dialog input,dialog select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{min-height:42px;padding:0 16px;border-radius:10px;border:0;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--teal-d)}.btn[disabled]{opacity:.55;cursor:default}
.btn.pri{background:var(--orange)}.btn.pri:hover{background:#d97706}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal-d);background:transparent}
.stats{color:var(--mute);font-size:14px}
/* user rows */
.list{display:grid;gap:10px}
.u{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr) auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
.u.blocked,.u.expired{opacity:.62}
.who{display:flex;gap:10px;align-items:flex-start}
.who .pk{width:18px;height:18px;margin-top:12px;accent-color:var(--teal-d);flex:none}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.u.adm .av{background:var(--orange)}
.who b{display:block;font-size:16px;line-height:1.3}.who small{color:var(--mute);direction:ltr;display:block;text-align:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);white-space:nowrap}
.chip.ph{direction:ltr}.chip.exp,.chip.soon,.chip.pend{background:#fff1dc;color:#8a4b00}.chip.soon{font-weight:700}.chip.dead,.chip.blk{background:#fde2e2;color:#9b1c1c}
.chip.adm{background:var(--navy);color:#fff}.chip.g{background:#e7f0fe;color:#1a56b8}.chip.lv{background:#fff1dc;color:#8a4b00}
/* course access pills */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.tg>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--card);display:grid;gap:4px;align-content:start}
.cp.on{border-color:color-mix(in srgb,var(--teal-d) 55%,var(--line));background:light-dark(#effbf9,#12334a)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;user-select:none}
.tg input,.rec input{position:absolute;opacity:0;pointer-events:none}
.t{flex:none;width:38px;height:22px;border-radius:999px;background:#c9cbd8;position:relative;transition:background .2s}
.t::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
input:checked+.t{background:var(--teal-d)}input:checked+.t::after{inset-inline-start:19px}
input:focus-visible+.t{outline:3px solid var(--orange);outline-offset:2px}
input:disabled+.t{opacity:.5}
.cp:not(.on) .tg{color:var(--mute)}
.rec{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:700;color:#8a4b00;cursor:pointer;border-top:1px dashed var(--line);padding-top:4px}
.rec .t{width:32px;height:18px}.rec .t::after{width:12px;height:12px}.rec input:checked+.t{background:var(--orange)}.rec input:checked+.t::after{inset-inline-start:17px}
/* menu */
.more{position:relative}
.more>button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:20px;line-height:1}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:6px;display:none;z-index:4}
.more.open .menu{display:block}
.menu button{display:block;width:100%;text-align:start;padding:10px;border:0;background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--soft)}.menu .del{color:var(--red)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;z-index:20;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
.msg{text-align:center;color:var(--mute);padding:40px 10px}
.gate{max-width:520px;margin:60px auto;text-align:center}
/* bulk */
.bulk{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border:1.5px dashed var(--teal-d);border-radius:12px;font-size:14px;background:light-dark(#effbf9,#12334a)}
.bulk.on{display:flex}.bulk select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:auto}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:22px;width:min(460px,94vw)}
dialog::backdrop{background:rgba(10,10,30,.5)}
dialog h3{margin:0 0 4px;font-size:20px}dialog p{margin:0 0 12px;color:var(--mute);font-size:14px}
dialog form{display:grid;gap:12px}dialog label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
dialog .row{display:flex;gap:8px;align-items:center}dialog .row input{flex:1}
dialog .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:4px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--mute);font-weight:400}
#idlg{width:min(720px,96vw)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sect{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.sect>b{font-size:15px}
.isw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.isw .rec{display:none}.isw .cp.on .rec{display:flex}
dialog label.opt{display:flex;gap:8px;align-items:center;font-weight:500}
dialog label.opt input{width:auto}
.ok{background:light-dark(#e9fbf3,#123a2c);border:1px solid #9be3c4;border-radius:12px;padding:14px;display:grid;gap:10px}
.ok p{margin:0;white-space:pre-line;color:var(--ink);font-size:14px}
#adlg{width:min(760px,96vw)}
.acc{display:grid;gap:10px;max-height:62vh;overflow:auto;padding:2px}
.acr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center}
.acr>b{grid-row:1/-1;align-self:start;padding-top:6px}
.acr select,.acr input[type=date],.acr input[type=text]{padding:7px 9px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:auto}
.acr .dl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.acr .dl button{padding:4px 9px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:12.5px}
.acr .dl button:hover{border-color:var(--teal)}.acr.off .dl,.acr.off .nt{opacity:.45;pointer-events:none}
.acr .nt{width:100%!important}
@media(max-width:980px){.u{grid-template-columns:1fr auto}.u .sw{grid-column:1/-1;order:3}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.filters,.f2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.acr{grid-template-columns:1fr}.acr>b{grid-row:auto}}
</style>
</head>
<body>
<header class="bar"><img src="/logo.png" alt="NGQA"><h1>מערכת ניהול</h1><a href="/">← לאתר הקורסים</a></header>
<div class="bo">
<nav class="side" id="side" aria-label="תפריט ניהול" hidden></nav>
<div>
<main id="main" class="view" data-v="users"><p class="msg">טוען…</p></main>
<section class="view" id="v-dash" data-v="dash" hidden></section>
<section class="view" id="v-courses" data-v="courses" hidden></section>
<section class="view" id="v-lessons" data-v="lessons" hidden></section>
<section class="view" id="v-progress" data-v="progress" hidden></section>
<section class="view" id="v-log" data-v="log" hidden></section>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/auth.js"></script>
<script>
{
const A=window.NGQAAuth,$=id=>document.getElementById(id);
const NAMES={ctfl:'CTFL 4.0',genai:'CT-GenAI',sql:'SQL',ste:'CT-STE',ai:'CT-AI',mat:'CT-MAT',jobs:'מחפשי עבודה'};
let users=[],courses=['ctfl','genai','sql','ste','ai','mat','jobs'],recC=['genai'],meEmail='',q='',cflt='all',picked=new Set();
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt=0;function toast(t,bad){const e=$('toast');e.textContent=t;e.classList.toggle('err',!!bad);e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3200)}
async function api(method,body){
  const s=await A.session();if(!s)throw new Error('יש להתחבר מחדש');
  const r=await fetch('/.netlify/functions/admin',{method,headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||('שגיאה '+r.status));return d}
const todayIL=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date());
const dmy=d=>d?d.split('-').reverse().join('/'):'';
const daysTo=d=>Math.round((Date.parse(d)-Date.parse(todayIL()))/864e5);
const expired=u=>!!u.expires&&!u.roles.includes('admin')&&todayIL()>=u.expires;
/* status for the filter: invited (no sign-up yet), active, blocked, expired */
/* v3.11 access levels per course: roles "<c>" = materials, "<c>-rec" = + recorded lessons; dates in u.access[c] = {m, r, note} */
const accOf=(u,c)=>(u.access&&u.access[c])||{};
const lvOf=(u,c)=>u.roles.includes('admin')?(recC.includes(c)?'full':'materials'):!u.roles.includes(c)?'none':(recC.includes(c)&&u.roles.includes(c+'-rec')?'full':'materials');
const LVN={none:'ללא גישה',materials:'מצגות וחומרים',full:'מלא (כולל הקלטות)'};
const addMonths=(base,n)=>{const t=todayIL(),b=base&&base>t?base:t;const d=new Date(b+'T12:00:00Z');const day=d.getUTCDate();d.setUTCMonth(d.getUTCMonth()+n);if(d.getUTCDate()<day)d.setUTCDate(0);return d.toISOString().slice(0,10)};
/* the soonest end date (course materials or recordings) inside the next 14 days, or null */
const soonest=u=>{if(u.roles.includes('admin'))return null;let best=null;for(const c of courses){if(!u.roles.includes(c))continue;const a=accOf(u,c);
  for(const [k,d] of [['m',a.m],['r',u.roles.includes(c+'-rec')?a.r:'']])if(d&&daysTo(d)>=0&&daysTo(d)<=14&&(!best||d<best.d))best={c,k,d}}
  if(u.expires&&daysTo(u.expires)>=0&&daysTo(u.expires)<=14&&(!best||u.expires<best.d))best={c:'',k:'all',d:u.expires};return best};
const status=u=>u.blocked?'blocked':expired(u)?'expired':!u.confirmed?'invited':'active';
const showPhone=p=>p?(p.startsWith('972')&&p.length===12?'0'+p.slice(3,5)+'-'+p.slice(5):'+'+p):'';
const waLink=(p,t)=>'https://wa.me/'+p+'?text='+encodeURIComponent(t.replace(/\s*\u{1F44B}/u,''));
let flt='all',dlgId=null;
const fmt=d=>d?new Date(d).toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'}):'';
function shell(){
  const cpI=c=>`<div class="cp"><label class="tg"><span>${NAMES[c]||c}</span><input type="checkbox" name="r" value="${c}"><span class="t"></span></label>${recC.includes(c)?`<label class="rec"><span>הקלטות</span><input type="checkbox" name="rr" value="${c}"><span class="t"></span></label>`:''}</div>`;
  $('main').innerHTML=`
  <section class="tiles" id="tiles" aria-label="סיכום"></section>
  <section class="card" aria-labelledby="h2">
    <div class="toolbar"><h2 id="h2">תלמידים</h2><span class="stats" id="stats"></span><button class="btn pri" type="button" id="invB">＋ הזמנת תלמיד</button></div>
    <div class="filters"><input class="search" id="q" type="search" placeholder="חיפוש לפי שם, מייל או טלפון" aria-label="חיפוש"><select class="flt" id="flt" aria-label="סינון לפי סטטוס"></select><select class="flt" id="cflt" aria-label="סינון לפי קורס ורמת גישה"></select></div>
    <div class="bulk" id="bulk"><b id="bulkN"></b><span>שינוי לנבחרים:</span><select id="bC" aria-label="קורס"></select><select id="bL" aria-label="רמת גישה"></select><select id="bM" aria-label="תוקף"><option value="">בלי לשנות תאריך</option><option value="3">+3 חודשים</option><option value="6">+6 חודשים</option><option value="12">+12 חודשים</option><option value="clear">ללא הגבלת זמן</option></select><button class="btn" type="button" id="bGo">החלה</button><button class="btn ghost" type="button" id="bX">ניקוי הבחירה</button></div>
    <div class="list" id="list"></div>
  </section>
  <dialog id="idlg" aria-labelledby="idlgH"><h3 id="idlgH">הזמנת תלמיד</h3><p>התלמיד יקבל מייל עם קישור לבחירת סיסמה. פותחים רק את הקורסים שהוא צריך.</p>
    <form id="inv">
      <div class="f2"><label>שם מלא<input type="text" name="name" autocomplete="off"></label>
        <label>מייל<input type="email" name="email" required dir="ltr" autocomplete="off"></label>
        <label>טלפון נייד<input type="tel" name="phone" dir="ltr" autocomplete="off" placeholder="050-1234567"></label>
        <label>תוקף הגישה לקורסים<select name="until"><option value="">ללא הגבלת זמן</option><option value="3">3 חודשים</option><option value="6">6 חודשים</option><option value="12">12 חודשים</option></select></label></div>
      <div class="sect"><b>גישה לקורסים</b><span class="hint">הדליקו את הקורסים שנפתחים לתלמיד. בקורס שיש בו שיעורים מוקלטים, יופיע מתחתיו מתג "הקלטות".</span><div class="isw" id="isw">${courses.map(cpI).join('')}</div></div>
      <div class="sect"><label>נעילת כל הגישה לאתר בתאריך <span class="hint">(לא חובה)</span><input type="date" name="expires" min="${todayIL()}"></label>
        <label class="opt"><input type="checkbox" name="wa"> לשלוח את ההזמנה גם בוואטסאפ <span class="hint">(נפתח וואטסאפ עם הודעה מוכנה)</span></label></div>
      <div class="acts"><button class="btn pri" type="submit">שליחת הזמנה</button><button class="btn ghost" type="button" id="idlgX">ביטול</button></div>
    </form>
    <div class="ok" id="invOk" hidden><b id="invOkT"></b><p id="waT"></p><div class="acts"><button class="btn ghost" type="button" id="waC">העתקת ההודעה לוואטסאפ</button><button class="btn" type="button" id="invMore">הזמנה נוספת</button><button class="btn ghost" type="button" id="invDone">סגירה</button></div></div>
  </dialog>
  <dialog id="dlg" aria-labelledby="dlgH"><h3 id="dlgH">פרטי משתמש</h3><p id="dlgE" dir="ltr" style="text-align:end"></p>
    <form id="dlgF" method="dialog">
      <label>שם מלא<input type="text" name="name" autocomplete="off"></label>
      <label>טלפון נייד<input type="tel" name="phone" dir="ltr" autocomplete="off" placeholder="050-1234567"></label>
      <label>נעילת כל הגישה לאתר בתאריך <span class="hint">החל מהתאריך הזה (שעון ישראל) הגישה לכל הקורסים נחסמת. ריק = ללא הגבלה. לתאריך לכל קורס בנפרד — "גישה לקורסים ותאריכים".</span>
        <span class="row"><input type="date" name="expires"><button class="btn ghost" type="button" id="dlgClr">ללא תאריך</button></span></label>
      <div class="acts"><button class="btn" type="submit" value="save">שמירה</button><button class="btn ghost" type="button" id="dlgX">ביטול</button></div>
    </form></dialog>
  <dialog id="adlg" aria-labelledby="adlgH"><h3 id="adlgH">גישה לקורסים ותאריכים</h3><p id="adlgE" dir="ltr" style="text-align:end"></p>

        const r=new Set(u.roles);adm?r.delete('admin'):r.add('admin');upd((await api('POST',{action:'roles',id,roles:[...r]})).user);toast('עודכן');break}
      case 'block':{if(!u.blocked&&!confirm(`לחסום את ${who}? הוא לא יוכל להיכנס לאף קורס עד שתבטלו.`))return;
        upd((await api('POST',{action:'block',id,blocked:!u.blocked})).user);toast(u.blocked?'החסימה בוטלה':'המשתמש נחסם');break}
      case 'delete':if(!confirm(`למחוק לצמיתות את ${who} (${u.email})? אי אפשר לבטל.`))return;
        await api('POST',{action:'delete',id});users=users.filter(x=>x.id!==id);list();toast('המשתמש נמחק');break}
  }catch(x){toast(x.message,1)}});
(async()=>{
  if(!(await A.isEnabled())){$('main').innerHTML='<div class="card gate"><h2>ההתחברות עוד לא הופעלה</h2><p>צריך להפעיל את Netlify Identity באתר. אחרי זה הדף הזה יעבוד.</p></div>';return}
  const i=A.info(await A.session());
  if(!i){location.replace('/?login=1&next='+encodeURIComponent('/admin/'));return}
  try{const d=await api('GET');users=d.users;courses=d.courses||courses;recC=d.rec||recC;meEmail=d.me;shell();list();
    window.boUsers=()=>users;window.boSetRec=r=>{recC=r;shell();list()};window.boApi=api;window.boToast=toast;document.dispatchEvent(new Event('bo:ready'))}
  catch(x){$('main').innerHTML=`<div class="card gate"><h2>אין גישה לדף הניהול</h2><p>${esc(x.message)}</p><p><a href="/">חזרה לאתר</a></p></div>`}
})();
}
</script>
<script src="bo.js"></script>
