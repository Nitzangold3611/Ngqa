<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ניהול משתמשים · NGQA הדרכות</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#121133">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--navy:#121133;--teal:#14DACD;--teal-d:#0E9F97;--orange:#F38911;--red:#c0392b;
--bg:light-dark(#f4f6fb,#0b0a24);--card:light-dark(#fff,#18173f);--ink:light-dark(#121133,#eef0ff);--mute:light-dark(#5d5c7c,#a9a8cf);--line:light-dark(#e1e3ef,#2a2960);--soft:light-dark(#eef0f8,#26255a)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Heebo,Arial,sans-serif}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button,input{font:inherit}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(3vw,12px);position:sticky;top:0;z-index:5}
.bar img{height:38px}.bar h1{font-size:19px;margin:0;flex:1}
.bar a{color:#c9cbf0;text-decoration:none;border:1.5px solid #3b3a78;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.bar a:hover{color:var(--teal);border-color:var(--teal)}
main{max-width:1000px;margin:0 auto;padding:20px max(3vw,12px) 60px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0 0 12px;font-size:18px}
.inv{display:grid;grid-template-columns:1fr 1.3fr auto;gap:10px;align-items:end}
.inv label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.inv input[type=text],.inv input[type=email],.search{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.inv .crs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:14px}
.btn{min-height:42px;padding:0 16px;border-radius:10px;border:0;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--teal-d)}.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal-d);background:transparent}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 40%,transparent)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top h2{margin:0;flex:1}.search{min-width:220px}
.stats{color:var(--mute);font-size:14px}
.list{display:grid;gap:10px}
.u{display:grid;grid-template-columns:minmax(0,1.4fr) auto auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.u.blocked{opacity:.6}
.who b{display:block;font-size:16px}.who small{color:var(--mute);direction:ltr;display:block;text-align:end;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft)}
.chip.pend{background:#fff1dc;color:#8a4b00}.chip.adm{background:var(--navy);color:#fff}.chip.blk{background:#fde2e2;color:#9b1c1c}.chip.g{background:#e7f0fe;color:#1a56b8}
.sw{display:flex;gap:14px;flex-wrap:wrap}
.tg{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .t{width:46px;height:26px;border-radius:999px;background:#c9cbd8;position:relative;transition:background .2s}
.tg .t::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.tg input:checked+.t{background:var(--teal-d)}.tg input:checked+.t::after{inset-inline-start:23px}
.tg input:focus-visible+.t{outline:3px solid var(--orange);outline-offset:2px}
.tg input:disabled+.t{opacity:.5}
.more{position:relative}
.more>button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:20px;line-height:1}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:6px;display:none;z-index:4}
.more.open .menu{display:block}
.menu button{display:block;width:100%;text-align:start;padding:10px;border:0;background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--soft)}.menu .del{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;z-index:20;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
.msg{text-align:center;color:var(--mute);padding:40px 10px}
.wa{display:none;margin-top:12px;padding:12px;border-radius:12px;background:light-dark(#e9fbf3,#123a2c);border:1px solid #9be3c4;font-size:14px}
.wa.on{display:block}.wa p{margin:0 0 8px;white-space:pre-line}
.gate{max-width:520px;margin:60px auto;text-align:center}
@media(max-width:760px){.inv{grid-template-columns:1fr}.u{grid-template-columns:1fr auto}.u .sw{grid-column:1/-1;order:3}.search{min-width:0;flex:1}}
</style>
</head>
<body>
<header class="bar"><img src="/logo.png" alt="NGQA"><h1>ניהול משתמשים</h1><a href="/">← לאתר הקורסים</a></header>
<main id="main"><p class="msg">טוען…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/auth.js"></script>
<script>
{
const A=window.NGQAAuth,$=id=>document.getElementById(id);
const NAMES={ctfl:'CTFL 4.0',genai:'CT-GenAI',sql:'SQL',ste:'CT-STE',ai:'CT-AI',mat:'CT-MAT',jobs:'מחפשי עבודה'};
let users=[],courses=['ctfl','genai','sql','ste','ai','mat','jobs'],meEmail='',q='';
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt=0;function toast(t,bad){const e=$('toast');e.textContent=t;e.classList.toggle('err',!!bad);e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3200)}
async function api(method,body){
  const s=await A.session();if(!s)throw new Error('יש להתחבר מחדש');
  const r=await fetch('/.netlify/functions/admin',{method,headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||('שגיאה '+r.status));return d}
const fmt=d=>d?new Date(d).toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'}):'';
function shell(){
  $('main').innerHTML=`
  <section class="card" aria-labelledby="h1">
    <h2 id="h1">הזמנת תלמיד</h2>
    <form id="inv" class="inv">
      <label>שם מלא<input type="text" name="name" autocomplete="off"></label>
      <label>מייל<input type="email" name="email" required dir="ltr" autocomplete="off"></label>
      <button class="btn" type="submit">שליחת הזמנה</button>
      <div class="crs"><span>גישה לקורסים:</span>${courses.map(c=>`<label class="tg" style="flex-direction:row;gap:8px"><input type="checkbox" name="r" value="${c}" checked><span class="t"></span>${NAMES[c]||c}</label>`).join('')}</div>
    </form>
    <div class="wa" id="wa"><p id="waT"></p><button class="btn ghost" type="button" id="waC">העתקת ההודעה לוואטסאפ</button></div>
  </section>
  <section class="card" aria-labelledby="h2">
    <div class="top"><h2 id="h2">תלמידים</h2><span class="stats" id="stats"></span><input class="search" id="q" type="search" placeholder="חיפוש לפי שם או מייל" aria-label="חיפוש"></div>
    <div class="list" id="list"></div>
  </section>`;
  $('inv').onsubmit=invite;$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();list()};
  $('waC').onclick=async()=>{try{await navigator.clipboard.writeText($('waT').textContent);toast('ההודעה הועתקה')}catch(e){toast('לא הצלחתי להעתיק – סמנו והעתיקו ידנית',1)}};
}
function row(u){
  const self=u.email===meEmail,adm=u.roles.includes('admin');
  return `<div class="u${u.blocked?' blocked':''}" data-id="${u.id}">
    <div class="who"><b>${esc(u.name||u.email.split('@')[0])}</b><small>${esc(u.email)}</small>
      <div class="chips">${!u.confirmed?`<span class="chip pend">הוזמן ${fmt(u.invited_at)} · טרם נרשם</span>`:`<span class="chip">פעיל מ-${fmt(u.created_at)}</span>`}
      ${adm?'<span class="chip adm">מנהל</span>':''}${u.blocked?'<span class="chip blk">חסום</span>':''}${u.provider==='google'?'<span class="chip g">Google</span>':''}</div></div>
    <div class="sw">${courses.map(c=>`<label class="tg"><input type="checkbox" data-c="${c}" ${u.roles.includes(c)||adm?'checked':''} ${adm||u.blocked?'disabled':''}><span class="t"></span>${NAMES[c]||c}</label>`).join('')}</div>
    <div class="more"><button type="button" aria-label="פעולות נוספות עבור ${esc(u.email)}" aria-haspopup="true">⋯</button><div class="menu">
      ${!u.confirmed?'<button type="button" data-a="resend">שליחת ההזמנה שוב</button>':'<button type="button" data-a="recover">שליחת קישור לאיפוס סיסמה</button>'}
      <button type="button" data-a="wa">העתקת הודעה לוואטסאפ</button>
      ${self?'':`<button type="button" data-a="admin">${adm?'הסרת הרשאת מנהל':'הפיכה למנהל (גישה לכל הקורסים)'}</button>`}
      ${self?'':`<button type="button" data-a="block">${u.blocked?'ביטול חסימה':'חסימת גישה (בלי למחוק)'}</button>`}
      ${self?'':'<button type="button" data-a="delete" class="del">מחיקת המשתמש</button>'}
    </div></div></div>`}
function list(){
  const f=users.filter(u=>!q||(u.email+' '+u.name).toLowerCase().includes(q)).sort((a,b)=>(b.roles.includes('admin')-a.roles.includes('admin'))||(a.name||a.email).localeCompare(b.name||b.email,'he'));
  $('list').innerHTML=f.length?f.map(row).join(''):`<p class="msg">${users.length?'לא נמצאו תלמידים לחיפוש הזה.':'עדיין אין תלמידים. הזמינו את הראשון למעלה.'}</p>`;
  const st=users.filter(u=>!u.roles.includes('admin'));
  $('stats').textContent=`${st.length} תלמידים · ${st.filter(u=>!u.confirmed).length} ממתינים להרשמה`;
}
function waText(name){return `שלום${name?' '+name:''} 👋\nפתחתי לך גישה לאתר המצגות של NGQA: https://courses.ngqa.net\nתקבל/י מייל מ-Netlify (באנגלית) עם הנושא "You've been invited" – לחצו על הקישור, בחרו סיסמה ונכנסים. אם המייל לא מגיע, בדקו בספאם.\nאפשר גם להיכנס עם Google, אם המייל שלך הוא Gmail.`}
async function invite(e){
  e.preventDefault();const f=e.target,b=f.querySelector('.btn');b.disabled=true;
  try{const d=await api('POST',{action:'invite',email:f.email.value,name:f.name.value,roles:[...f.querySelectorAll('[name=r]:checked')].map(x=>x.value)});
    users.push(d.user);list();toast('ההזמנה נשלחה ל-'+d.user.email);
    $('waT').textContent=waText(f.name.value.trim());$('wa').classList.add('on');f.reset();f.querySelectorAll('[name=r]').forEach(x=>x.checked=true)}
  catch(x){toast(x.message,1)}finally{b.disabled=false}}
function upd(u){const k=users.findIndex(x=>x.id===u.id);if(k>=0)users[k]=u;list()}
document.addEventListener('change',async e=>{const t=e.target.closest('input[data-c]');if(!t)return;
  const id=t.closest('.u').dataset.id,u=users.find(x=>x.id===id);
  const roles=new Set(u.roles);t.checked?roles.add(t.dataset.c):roles.delete(t.dataset.c);t.disabled=true;
  try{const d=await api('POST',{action:'roles',id,roles:[...roles]});upd(d.user);toast(`${NAMES[t.dataset.c]}: ${t.checked?'נפתח':'נסגר'} עבור ${d.user.name||d.user.email}`)}
  catch(x){t.checked=!t.checked;t.disabled=false;toast(x.message,1)}});
document.addEventListener('click',async e=>{
  const m=e.target.closest('.more>button');document.querySelectorAll('.more.open').forEach(x=>{if(!m||x!==m.parentNode)x.classList.remove('open')});
  if(m){m.parentNode.classList.toggle('open');return}
  const a=e.target.closest('[data-a]');if(!a)return;a.closest('.more').classList.remove('open');
  const id=a.closest('.u').dataset.id,u=users.find(x=>x.id===id),who=u.name||u.email;
  try{
    switch(a.dataset.a){
      case 'resend':await api('POST',{action:'resend',id});toast('ההזמנה נשלחה שוב');break;
      case 'recover':await api('POST',{action:'recover',id});toast('נשלח קישור לאיפוס סיסמה ל-'+u.email);break;
      case 'wa':try{await navigator.clipboard.writeText(waText(u.name));toast('ההודעה הועתקה')}catch(x){$('waT').textContent=waText(u.name);$('wa').classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}break;
      case 'admin':{const adm=u.roles.includes('admin');if(!confirm(adm?`להסיר את הרשאת המנהל מ-${who}?`:`להפוך את ${who} למנהל? מנהל רואה את כל הקורסים ויכול לנהל משתמשים.`))return;
        const r=new Set(u.roles);adm?r.delete('admin'):r.add('admin');upd((await api('POST',{action:'roles',id,roles:[...r]})).user);toast('עודכן');break}
      case 'block':{if(!u.blocked&&!confirm(`לחסום את ${who}? הוא לא יוכל להיכנס לאף קורס עד שתבטלו.`))return;
        upd((await api('POST',{action:'block',id,blocked:!u.blocked})).user);toast(u.blocked?'החסימה בוטלה':'המשתמש נחסם');break}
      case 'delete':if(!confirm(`למחוק לצמיתות את ${who} (${u.email})? אי אפשר לבטל.`))return;
        await api('POST',{action:'delete',id});users=users.filter(x=>x.id!==id);list();toast('המשתמש נמחק');break}
  }catch(x){toast(x.message,1)}});
(async()=>{
  if(!(await A.isEnabled())){$('main').innerHTML='<div class="card gate"><h2>ההתחברות עוד לא הופעלה</h2><p>צריך להפעיל את Netlify Identity באתר. אחרי זה הדף הזה יעבוד.</p></div>';return}
  const i=A.info(await A.session());
  if(!i){location.replace('/?login=1&next='+encodeURIComponent('/admin/'));return}
  try{const d=await api('GET');users=d.users;courses=d.courses||courses;meEmail=d.me;shell();list()}
  catch(x){$('main').innerHTML=`<div class="card gate"><h2>אין גישה לדף הניהול</h2><p>${esc(x.message)}</p><p><a href="/">חזרה לאתר</a></p></div>`}
})();
}
</script>
</body>
</html>
